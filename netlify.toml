# Deterministic build config so the deploy doesn't depend on UI settings.
# Netlify auto-detects Next.js, but pinning this makes the build reproducible
# and self-documenting in the repo.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 needs a modern Node; Netlify's default can lag behind.
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serve the Android build as a real download.
# Netlify would otherwise send an unknown extension as application/octet-stream,
# which mostly works but leaves the filename and handling up to the browser.
[[headers]]
  for = "/docappoint.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"DocAppoint.apk\""
    Cache-Control = "public, max-age=3600"
